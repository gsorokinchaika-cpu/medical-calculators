name: Calculator checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and regression tests
        run: |
          node --check assets/app-7a53f8f987.js
          node --check sw.js
          node --test tests/*.test.mjs
